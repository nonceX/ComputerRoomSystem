<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 机房综合管理系统</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo"><i class="fa fa-server"></i></div>
        <h1 class="login-title">机房综合管理系统</h1>
        <p class="login-subtitle">Computer Room Management System</p>
      </div>

      <form id="login-form" novalidate>
        <div class="form-error" id="login-error"></div>

        <div class="form-item">
          <i class="fa fa-user"></i>
          <input type="text" id="username" placeholder="请输入账号" autocomplete="username">
        </div>

        <div class="form-item">
          <i class="fa fa-lock"></i>
          <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
          <i class="fa fa-eye-slash password-toggle" id="pwd-toggle"></i>
        </div>

        <div class="login-options">
          <span class="register-link"><a href="register.html">还没有账号？立即注册</a></span>
        </div>

        <button type="submit" class="btn-login" id="btn-login">
          <i class="fa fa-sign-in-alt"></i> 登 录
        </button>
      </form>

      <div class="login-footer">Copyright © 2026 机房综合管理系统 All Rights Reserved.</div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
