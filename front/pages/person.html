<div class="search-card">
  <form class="search-form" id="person-search-form">
    <div class="form-item">
      <label>姓名</label>
      <input type="text" id="person-search-name" placeholder="请输入姓名">
    </div>
    <div class="form-item">
      <label>部门</label>
      <select id="person-search-dept">
        <option value="">全部</option>
        <option value="技术部">技术部</option>
        <option value="运维部">运维部</option>
        <option value="后勤部">后勤部</option>
      </select>
    </div>
    <div class="form-item">
      <label>角色</label>
      <select id="person-search-role">
        <option value="">全部</option>
        <option value="管理员">管理员</option>
        <option value="普通用户">普通用户</option>
      </select>
    </div>
    <div class="form-item">
      <button type="submit" class="btn btn-primary" id="btn-person-search"><i class="fa fa-search"></i> 搜索</button>
    </div>
    <div class="form-item">
      <button type="button" class="btn" id="btn-person-reset"><i class="fa fa-refresh"></i> 重置</button>
    </div>
  </form>
</div>

<div class="table-card">
  <div class="table-toolbar">
    <button type="button" class="btn btn-primary btn-sm" id="btn-person-add"><i class="fa fa-plus"></i> 添加人员</button>
    <button type="button" class="btn btn-danger btn-sm" id="btn-person-batch-del"><i class="fa fa-trash"></i> 批量删除</button>
  </div>
  <table class="data-table">
    <thead>
      <tr>
        <th width="40"><input type="checkbox" id="person-check-all"></th>
        <th>姓名</th>
        <th>工号</th>
        <th>部门</th>
        <th>角色</th>
        <th>电话</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="person-tbody"></tbody>
  </table>
  <div class="pagination" id="person-pagination"></div>
</div>

<!-- 添加/编辑弹窗 -->
<div class="modal-overlay" id="person-modal-overlay" style="display:none;">
  <div class="modal">
    <div class="modal-header">
      <span id="person-modal-title">添加人员</span>
      <span class="modal-close" id="person-modal-close"><i class="fa fa-times"></i></span>
    </div>
    <div class="modal-body">
      <div class="form-item">
        <label>姓名</label>
        <input type="text" id="person-name" placeholder="请输入姓名">
      </div>
      <div class="form-item">
        <label>工号</label>
        <input type="text" id="person-no" placeholder="请输入工号">
      </div>
      <div class="form-item">
        <label>部门</label>
        <select id="person-dept">
          <option value="技术部">技术部</option>
          <option value="运维部">运维部</option>
          <option value="后勤部">后勤部</option>
        </select>
      </div>
      <div class="form-item">
        <label>角色</label>
        <select id="person-role">
          <option value="普通用户">普通用户</option>
          <option value="管理员">管理员</option>
        </select>
      </div>
      <div class="form-item">
        <label>电话</label>
        <input type="text" id="person-phone" placeholder="请输入联系电话">
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-primary" id="btn-person-save">保存</button>
      <button type="button" class="btn" id="btn-person-cancel">取消</button>
    </div>
  </div>
</div>
