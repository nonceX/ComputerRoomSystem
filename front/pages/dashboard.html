<div class="stat-cards">
  <div class="stat-card">
    <div class="stat-icon stat-icon--blue"><i class="fa fa-users"></i></div>
    <div class="stat-info">
      <div class="stat-label">人员总数</div>
      <div class="stat-value" id="dashboard-user-count">0</div>
    </div>
  </div>
  <div class="stat-card">
    <div class="stat-icon stat-icon--green"><i class="fa fa-server"></i></div>
    <div class="stat-info">
      <div class="stat-label">设备总数</div>
      <div class="stat-value" id="dashboard-equipment-quantity">0</div>
    </div>
  </div>
  <div class="stat-card">
    <div class="stat-icon stat-icon--orange"><i class="fa fa-calendar-check"></i></div>
    <div class="stat-info">
      <div class="stat-label">今日考勤</div>
      <div class="stat-value" id="dashboard-attendance-count">0</div>
    </div>
  </div>
  <div class="stat-card">
    <div class="stat-icon stat-icon--red"><i class="fa fa-hourglass-half"></i></div>
    <div class="stat-info">
      <div class="stat-label">低库存预警</div>
      <div class="stat-value" id="dashboard-low-stock-count">0</div>
    </div>
  </div>
</div>

<div class="chart-card" id="photoCard">
  <div class="photo-header">
    <div class="chart-title">
      机房照片
      <span class="subtitle" id="photoCounter"></span>
    </div>
    <div class="photo-toolbar">
      <button type="button" class="photo-action-btn" id="photoUploadBtn">
        <i class="fa fa-upload" aria-hidden="true"></i>
        上传照片
      </button>
      <button type="button" class="photo-action-btn photo-action-btn--danger" id="photoDeleteBtn" disabled>
        <i class="fa fa-trash" aria-hidden="true"></i>
        删除当前照片
      </button>
      <input type="file" id="photoFileInput" accept="image/*" multiple hidden>
    </div>
  </div>
  <div class="photo-gallery" id="photoGallery">
    <div class="photo-placeholder" id="photoPlaceholder">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4">
        <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>
      </svg>
      <p>暂无照片</p>
    </div>
    <div class="photo-main" id="photoMain" style="display:none;">
      <img id="photoImage" alt="机房照片">
      <div class="photo-thumbs" id="photoThumbs"></div>
    </div>
  </div>
  <div class="photo-nav" id="photoNav" style="display:none;">
    <button type="button" class="photo-btn" id="prevBtn" aria-label="上一张" title="上一张">
      <i class="fa fa-chevron-left" aria-hidden="true"></i>
    </button>
    <button type="button" class="photo-btn" id="nextBtn" aria-label="下一张" title="下一张">
      <i class="fa fa-chevron-right" aria-hidden="true"></i>
    </button>
  </div>
</div>

<div class="dashboard-grid">
  <div class="table-card">
    <h3 class="panel-title">最近动态</h3>
    <ul class="activity-list" id="dashboard-activities"></ul>
  </div>

  <div class="table-card">
    <h3 class="panel-title">系统信息</h3>
    <div class="system-info">
      <div class="info-row">
        <span class="info-label">系统版本</span>
        <span>v1.0.0</span>
      </div>
      <div class="info-row">
        <span class="info-label">运行环境</span>
        <span>HTML / CSS / JS / JAVA / MYSQL </span>
      </div>
      <div class="info-row">
        <span class="info-label">部署方式</span>
        <span>线上部署</span>
      </div>
      <div class="info-row">
        <span class="info-label">当前账号</span>
        <span id="dashboard-current-user">未登录</span>
      </div>
      <div class="info-row">
        <span class="info-label">数据来源</span>
        <span>后端数据库</span>
      </div>
      <div class="info-row">
        <span class="info-label">技术栈</span>
        <span>StringBoot 仿造ruoyi</span>
      </div>
    </div>
  </div>
</div>
